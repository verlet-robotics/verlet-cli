name: Release

# Triggers:
#   * push tag v* — full release path: build → publish (PyPI Trusted Publishing,
#     first run requires admin approval in the `pypi` environment) →
#     pipx-smoke + uvx-smoke (post-publish smoke matrices) + brew-bump
#     (auto-PR against verlet-robotics/homebrew-verlet).
#   * pull_request (non-draft) — only the recipe-staging matrix runs. Walks
#     teleop-manager/frontend/docs/content/**/*.mdx in verlet-server@main
#     (recipes/, cli/, milestones/), extracts every ```bash recipe fence, and
#     runs each against staging-api.verlet.co. Failures block merge per
#     D-DIST4 (CLIDIST-07).
#   * workflow_dispatch — only `build` runs (manual artifact debugging).

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # PyPI Trusted Publishing (OIDC)

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  pipx-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx ensurepath
      - name: Install verlet via pipx
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Installing verlet==${VERSION}"
          python -m pipx install "verlet==${VERSION}"
      - name: Verify verlet --version
        shell: bash
        run: |
          # pipx ensurepath only updates future shells; resolve the bin dir now.
          BINDIR="$(python -m pipx environment --value PIPX_BIN_DIR)"
          export PATH="$BINDIR:$PATH"
          verlet --version

  uvx-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Verify uvx verlet --version
        run: uvx verlet --version

  # Auto-bump the Homebrew formula in verlet-robotics/homebrew-verlet on every
  # PyPI release (Plan 30-13 Task 3, CLIDIST-03). Opens a PR (never direct push)
  # so brew-test-bot CI on the tap can gate the bump before it lands.
  brew-bump:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      # Hand-rolled bump (replaces dawidd6/action-homebrew-bump-formula@v3 as
      # of c430d45 → 7d15417 — see CHANGELOG 0.8.6). The action wrapped
      # `brew bump-formula-pr`, which passes `--uploaded-prior-to=<now - 24h>`
      # to pip's dry-run resolver to make resource bumps reproducible. Every
      # version we tag is <24h old by definition, so the resolver always
      # filtered out the just-published version and exited 1. Tried
      # `livecheck: true` in c430d45 — same failure on v0.8.5 because brew
      # still walks the resources via the cutoff'd dry-run regardless.
      #
      # The hand-rolled path: read sdist url+sha256 from PyPI JSON directly,
      # patch only the formula's top-level url+sha256 (resource bumps stay
      # out of band — see "Resources are NOT auto-updated" in the PR body),
      # push a feature branch on the tap, open a PR via `gh`. The tap's own
      # brew-test-bot workflow gates the merge.

      - name: Wait for PyPI to expose v${{ github.ref_name }} sdist
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 12); do
            if curl -fsS "https://pypi.org/pypi/verlet/${VERSION}/json" >/dev/null 2>&1; then
              echo "PyPI shows verlet==${VERSION} (attempt $i)"; exit 0
            fi
            echo "Waiting for PyPI propagation (attempt $i/12)…"; sleep 10
          done
          echo "PyPI still not showing verlet==${VERSION} after 2min"; exit 1

      - name: Read sdist url + sha256 from PyPI JSON
        id: pypi
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          JSON=$(curl -fsS "https://pypi.org/pypi/verlet/${VERSION}/json")
          URL=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          SHA256=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          if [ -z "$URL" ] || [ -z "$SHA256" ] || [ "$URL" = "null" ] || [ "$SHA256" = "null" ]; then
            echo "Failed to read sdist info from PyPI JSON for verlet==${VERSION}" >&2
            echo "JSON: $JSON" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}"         >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}"   >> "$GITHUB_OUTPUT"
          echo "Resolved: ${URL}  sha256=${SHA256}"

      - name: Check out homebrew-verlet
        uses: actions/checkout@v6
        with:
          repository: verlet-robotics/homebrew-verlet
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-verlet

      - name: Patch Formula/verlet.rb top-level url + sha256
        working-directory: homebrew-verlet
        env:
          NEW_URL: ${{ steps.pypi.outputs.url }}
          NEW_SHA256: ${{ steps.pypi.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          new_url = os.environ["NEW_URL"]
          new_sha = os.environ["NEW_SHA256"]
          f = pathlib.Path("Formula/verlet.rb")
          text = f.read_text()

          # Top-level url + sha256 lines are indented with exactly 2 spaces;
          # resource url + sha256 are 4-space indented. Anchor the pattern to
          # `^  url ` with re.MULTILINE so we never match a resource block.
          # The pair is matched together to ensure we never replace one
          # without the other.
          pattern = re.compile(
              r'^  url "[^"]+verlet-[0-9.]+\.tar\.gz"\n'
              r'  sha256 "[a-f0-9]{64}"',
              re.MULTILINE,
          )
          replacement = f'  url "{new_url}"\n  sha256 "{new_sha}"'
          new_text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              sys.stderr.write(
                  f"expected exactly 1 match for top-level url+sha pair, "
                  f"found {n}\n"
              )
              sys.exit(1)
          f.write_text(new_text)
          print(f"Patched Formula/verlet.rb → {new_url}")
          PY
          echo "--- diff ---"
          git diff Formula/verlet.rb

      - name: Push branch + open PR on tap
        working-directory: homebrew-verlet
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.pypi.outputs.version }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Idempotent no-op when nothing actually changed — covers
          # re-running brew-bump on an already-bumped tap state.
          if git diff --quiet Formula/verlet.rb; then
            echo "Formula already at v${VERSION} — nothing to do."
            exit 0
          fi
          BRANCH="bump/verlet-${VERSION}"
          git config user.name  "verlet-release-bot"
          git config user.email "release-bot@verlet.co"
          git checkout -B "$BRANCH"
          git add Formula/verlet.rb
          git commit -m "verlet ${VERSION}"
          git push -u origin "$BRANCH" --force-with-lease
          # D-DIST3: open a PR, never push to main directly. The tap's
          # brew-test-bot workflow runs the install matrix on the PR.
          gh pr create \
            --repo verlet-robotics/homebrew-verlet \
            --base main \
            --head "$BRANCH" \
            --title "verlet ${VERSION}" \
            --body "Automated bump from verlet-robotics/verlet-cli@${SHA} (tag ${TAG}).

          The tap's brew-test-bot workflow will run the install matrix
          (ubuntu-latest, macos-14, macos-15, macos-latest) on this PR.
          Merge when green.

          Resources are NOT auto-updated by this job — only the top-level
          url + sha256 change. Resource bumps run on a separate cadence
          via maintainer-driven \`brew bump-formula-pr\` calls."

  # Recipe-CI matrix (Plan 30-13 Task 5, CLIDIST-07, D-DIST4 quality gate;
  # Phase 35 D-RECIPE2 pivoted the walker root from frontend/docs/content/cli
  # to teleop-manager/frontend/docs/content so it discovers recipes/, cli/,
  # AND milestones/ recursively).
  # On every non-draft PR, walk teleop-manager/frontend/docs/content/**/*.mdx
  # in verlet-robotics/verlet-server@main, extract every ```bash recipe block,
  # and run each against staging-api.verlet.co. Any non-zero exit blocks merge.
  # Skips drafts to limit staging quota.
  recipe-staging:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: verlet-robotics/verlet-server
          ref: main
          path: verlet-server
          # Token needed because verlet-server is a private repo. The default
          # GITHUB_TOKEN cannot reach it — supply a fine-grained PAT or App
          # token in VERLET_SERVER_READ_TOKEN with contents:read on
          # verlet-robotics/verlet-server.
          token: ${{ secrets.VERLET_SERVER_READ_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verlet-cli + dev deps
        run: pip install -e ".[dev]"
      - name: Run all recipes against staging
        env:
          VERLET_STAGING_TEST: "1"
          VERLET_API_URL: https://staging-api.verlet.co
          VERLET_PROFILE: ci
          VERLET_CI_TOKEN: ${{ secrets.VERLET_STAGING_CI_TOKEN }}
          VERLET_DOCS_CONTENT_ROOT: ${{ github.workspace }}/verlet-server/teleop-manager/frontend/docs/content
          # HF_TOKEN for `verlet datasets push --to huggingface://...` recipes
          HF_TOKEN: ${{ secrets.VERLET_STAGING_HF_TOKEN }}
        run: pytest tests/recipes/ -v -m staging

  # Phase 35 D-CLIREF1: cross-repo docs PR job. After a successful PyPI
  # release (publish + pipx-smoke + uvx-smoke all green), regenerate
  # teleop-manager/frontend/docs/content/docs/cli/ via `verlet docs export`
  # and mirror verlet-cli/CHANGELOG.md to .../content/docs/changelog/index.mdx,
  # then open a PR against verlet-robotics/verlet-server. Branch name is
  # deterministic (docs-bot/cli-ref-{VERSION}) so re-runs supersede instead of
  # piling up open PRs (RESEARCH Pitfall 3).
  #
  # Requires: VERLET_SERVER_DOCS_PR_TOKEN secret — fine-grained PAT with
  # contents:write + pull-requests:write on verlet-robotics/verlet-server.
  # Operator-provisioned per deploy/RAILWAY.md "Phase 35 — Docs Content
  # Cross-Repo Automation" section.
  open-docs-pr:
    needs: [publish, pipx-smoke, uvx-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verlet-cli
        uses: actions/checkout@v6
        with:
          path: verlet-cli

      - name: Checkout verlet-server
        uses: actions/checkout@v6
        with:
          repository: verlet-robotics/verlet-server
          ref: main
          path: verlet-server
          token: ${{ secrets.VERLET_SERVER_DOCS_PR_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install verlet-cli (uv tool — avoids PEP 668 on system Python)
        working-directory: verlet-cli
        run: |
          # `uv pip install --system` fails on Ubuntu 24.04 because /usr is
          # externally-managed (PEP 668). `uv tool install` handles its own
          # venv and exposes the `verlet` script on PATH.
          uv tool install --editable .
          uv tool update-shell || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate CLI MDX
        working-directory: verlet-server/teleop-manager/frontend/docs
        run: |
          rm -rf content/docs/cli
          mkdir -p content/docs/cli
          verlet docs export --out content/docs/cli/

      - name: Mirror CHANGELOG (preserve milestone footer link)
        working-directory: verlet-server/teleop-manager/frontend/docs
        run: |
          mkdir -p content/docs/changelog
          # Path traversal: working-directory is verlet-server/teleop-manager/frontend/docs/.
          # Ascending FOUR `..` segments lands at $GITHUB_WORKSPACE
          # (docs → frontend → teleop-manager → verlet-server → workspace-root),
          # then descend into the sibling verlet-cli/ checkout. NOT five —
          # five `..` would escape $GITHUB_WORKSPACE entirely and ENOENT at
          # runtime on the first real release.
          #
          # 35-07-SUMMARY.md "Issues Encountered" — the seeded changelog
          # carries a footer link to /docs/milestones/v2.2 separated by an
          # `---` rule. Plan 35-10's overwrite must preserve it. We extract
          # the footer block (everything from the trailing `---` rule
          # onwards) BEFORE rewriting the file, then re-append it after the
          # mirror so the milestone link survives release-bot regenerations.
          FOOTER_FILE="$(mktemp)"
          if [ -f content/docs/changelog/index.mdx ]; then
            # Find last `---` separator that introduces the footer (after the
            # frontmatter close). awk picks the LAST `---`-on-its-own line
            # and prints from there to EOF.
            awk '
              /^---$/ { last=NR; lines[NR]=$0; next }
              { lines[NR]=$0 }
              END {
                if (last > 3) {
                  for (i=last; i<=NR; i++) print lines[i]
                }
              }
            ' content/docs/changelog/index.mdx > "$FOOTER_FILE"
          fi
          {
            echo '---'
            echo 'title: Changelog'
            echo 'description: Notable changes to the verlet CLI, mirrored from verlet-cli/CHANGELOG.md.'
            echo '---'
            echo
            echo '> Auto-refreshed from `verlet-cli/CHANGELOG.md` on every release.'
            echo '> Edit the source file in verlet-cli, not this page.'
            echo
            cat ../../../../verlet-cli/CHANGELOG.md
            if [ -s "$FOOTER_FILE" ]; then
              echo
              cat "$FOOTER_FILE"
            fi
          } > content/docs/changelog/index.mdx
          rm -f "$FOOTER_FILE"

      - name: Open / supersede docs PR
        working-directory: verlet-server
        env:
          GH_TOKEN: ${{ secrets.VERLET_SERVER_DOCS_PR_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BRANCH="docs-bot/cli-ref-${VERSION}"

          # Close any open superseded docs-bot PRs (RESEARCH Pitfall 3).
          for n in $(gh pr list --head 'docs-bot/cli-ref-*' --state open --json number --jq '.[].number'); do
            gh pr close "$n" --comment "superseded by v${VERSION}"
          done

          git config user.name "verlet-docs-bot"
          git config user.email "docs-bot@verlet.co"
          git checkout -b "$BRANCH"
          git add teleop-manager/frontend/docs/content/docs/cli teleop-manager/frontend/docs/content/docs/changelog
          if git diff --cached --quiet; then
            echo "No docs changes for v${VERSION}"; exit 0
          fi
          git commit -m "docs: refresh CLI ref + CHANGELOG for verlet v${VERSION}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: refresh CLI ref + CHANGELOG for verlet v${VERSION}" \
            --body "Auto-generated by verlet-cli release workflow.

          Regenerated from \`verlet docs export\` and \`verlet-cli/CHANGELOG.md\` at \`${GITHUB_SHA}\`.

          Merge after a normal review pass." \
            --label "docs"
