[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verlet"
version = "0.8.4"
description = "Verlet Data CLI — download ego and teleop datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.4",
    "pyyaml>=6",
]

[project.scripts]
verlet = "verlet.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/verlet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "staging: integration tests that hit staging-api.verlet.co (skipped unless VERLET_STAGING_TEST=1)",
]
